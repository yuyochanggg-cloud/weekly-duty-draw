<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>本週值日生抽籤</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg:#fffdf5; --ink:#111111; --muted:#4a4a4a; --surface:#ffffff; --surface-2:#f1ede0;
      --yellow:#ffe14d; --pink:#ff7aa8; --mint:#59e0b8; --blue:#8fb2ff;
      --bw:3px; --sh:5px 5px 0 var(--ink); --sh-s:3px 3px 0 var(--ink);
      --font:'Noto Sans TC','PingFang TC','Microsoft JhengHei','Segoe UI',system-ui,sans-serif;
      --ease:cubic-bezier(.22,.8,.3,1);
    }
    html { color-scheme: light; }
    body { font-family:var(--font); color:var(--ink); min-height:100dvh; line-height:1.6; font-size:16px;
      background-color:var(--bg); background-image:radial-gradient(#11111122 1.2px, transparent 1.2px); background-size:22px 22px; }
    .wrap { max-width:960px; margin:0 auto; padding:36px 16px 96px; }
    svg.i { width:20px; height:20px; flex:none; stroke:currentColor; fill:none; stroke-width:2.4; stroke-linecap:round; stroke-linejoin:round; }
    :focus-visible { outline:4px solid var(--blue); outline-offset:3px; }

    header { margin-bottom:28px; }
    .eyebrow { display:inline-flex; align-items:center; gap:8px; font-size:.8rem; font-weight:900; letter-spacing:.12em;
      background:var(--mint); border:var(--bw) solid var(--ink); padding:3px 12px; box-shadow:var(--sh-s); margin-bottom:14px; transform:rotate(-2deg); }
    h1 { font-size:clamp(2rem,6vw,3.2rem); font-weight:900; line-height:1.1; letter-spacing:-.02em; }
    h1 span { background:linear-gradient(transparent 58%, var(--yellow) 58%); }
    .subtitle { margin-top:10px; font-weight:500; color:var(--muted); }

    .hero { background:var(--yellow); border:var(--bw) solid var(--ink); box-shadow:8px 8px 0 var(--ink);
      padding:24px; margin-bottom:28px; position:relative; }
    .hero-label { display:inline-block; font-weight:900; font-size:.9rem; letter-spacing:.1em; background:var(--ink); color:var(--yellow);
      padding:2px 12px; margin-bottom:18px; }
    #winners { display:grid; grid-template-columns:repeat(auto-fit,minmax(170px,1fr)); gap:16px; min-height:92px; }
    .winner { display:flex; align-items:center; gap:14px; background:var(--surface); border:var(--bw) solid var(--ink);
      box-shadow:var(--sh-s); padding:14px 16px; animation:slam .35s var(--ease) both; }
    .winner:nth-child(2) { background:var(--pink); animation-delay:.07s; }
    .winner .av { width:50px; height:50px; background:var(--ink); color:var(--yellow); display:grid; place-items:center;
      font-size:1.4rem; font-weight:900; flex:none; }
    .winner .nm { font-size:1.5rem; font-weight:900; overflow-wrap:anywhere; line-height:1.2; }
    .winner.shuffling .nm { opacity:.5; }
    #no-result { grid-column:1/-1; display:flex; align-items:center; gap:10px; font-weight:700; }
    @keyframes slam { from { transform:translate(-8px,-12px) rotate(-3deg); opacity:0; } to { transform:none; opacity:1; } }

    .btn { display:inline-flex; align-items:center; justify-content:center; gap:8px; min-height:50px; padding:0 22px;
      font:inherit; font-weight:900; color:var(--ink); background:var(--surface); border:var(--bw) solid var(--ink);
      box-shadow:var(--sh-s); cursor:pointer; touch-action:manipulation;
      transition:transform .12s var(--ease), box-shadow .12s var(--ease), background-color .12s; }
    .btn:hover:not(:disabled) { transform:translate(-2px,-2px); box-shadow:5px 5px 0 var(--ink); }
    .btn:active:not(:disabled) { transform:translate(3px,3px); box-shadow:0 0 0 var(--ink); }
    .btn:disabled { opacity:.45; cursor:not-allowed; box-shadow:none; }
    .btn-draw { background:var(--pink); font-size:1.15rem; min-height:60px; padding:0 34px; box-shadow:var(--sh); }
    .btn-ghost:hover:not(:disabled) { background:var(--surface-2); }
    .btn-brand { background:var(--blue); }
    .actions { display:flex; gap:16px; flex-wrap:wrap; justify-content:center; margin-bottom:36px; }

    .grid { display:grid; gap:24px; grid-template-columns:minmax(0,1fr); align-items:start; }
    @media (min-width:800px) { .grid { grid-template-columns:repeat(2,minmax(0,1fr)); } }
    .card { background:var(--surface); border:var(--bw) solid var(--ink); box-shadow:var(--sh); padding:24px; }
    .card-title { display:flex; align-items:center; gap:10px; font-size:1.1rem; font-weight:900; margin-bottom:16px; }
    .card-title .count { margin-left:auto; font-size:.8rem; background:var(--yellow); border:2px solid var(--ink); padding:0 10px; font-variant-numeric:tabular-nums; }

    .progress-head { display:flex; justify-content:space-between; align-items:baseline; margin-bottom:10px; }
    .progress-num { font-size:2.6rem; font-weight:900; line-height:1; font-variant-numeric:tabular-nums; }
    .progress-num small { font-size:1rem; color:var(--muted); font-weight:700; }
    .progress-pct { font-weight:900; font-variant-numeric:tabular-nums; }
    .progress-wrap { height:22px; border:var(--bw) solid var(--ink); background:var(--surface); }
    .progress-bar { height:100%; width:0; background:repeating-linear-gradient(45deg,var(--mint) 0 10px,#3fc79e 10px 20px);
      border-right:var(--bw) solid var(--ink); transition:width .5s var(--ease); }
    .divider { height:var(--bw); background:var(--ink); margin:24px 0 20px; }

    #history-list { list-style:none; max-height:220px; overflow-y:auto; }
    #history-list li { display:flex; justify-content:space-between; align-items:center; gap:12px; padding:10px 0; border-bottom:2px dashed var(--ink); }
    #history-list li:last-child { border-bottom:0; }
    .hist-names { font-weight:800; }
    .hist-round { font-size:.8rem; font-weight:800; white-space:nowrap; background:var(--blue); border:2px solid var(--ink); padding:0 10px; }
    .empty-hint { color:var(--muted); font-weight:500; }

    #member-grid { display:flex; flex-wrap:wrap; gap:10px; margin-bottom:22px; }
    .member { display:inline-flex; align-items:center; gap:8px; padding:5px 5px 5px 6px; background:var(--surface);
      border:2px solid var(--ink); box-shadow:2px 2px 0 var(--ink); font-weight:800; }
    .member .av { width:30px; height:30px; background:var(--yellow); border:2px solid var(--ink); display:grid; place-items:center; font-size:.85rem; font-weight:900; }
    .member .st { display:none; align-items:center; gap:3px; font-size:.75rem; font-weight:900; background:var(--mint); border:2px solid var(--ink); padding:0 8px; }
    .member .st .i { width:13px; height:13px; stroke-width:3.2; }
    .member.drawn { background:var(--surface-2); box-shadow:none; }
    .member.drawn .st { display:inline-flex; }
    .member.drawn .nm { color:var(--muted); }
    .rm { position:relative; width:30px; height:30px; border:2px solid transparent; background:transparent; color:var(--ink); cursor:pointer; display:grid; place-items:center; }
    .rm::after { content:""; position:absolute; inset:-7px; }
    .rm:hover { background:var(--pink); border-color:var(--ink); }
    .rm .i { width:16px; height:16px; stroke-width:3; }

    .add-row { display:flex; gap:12px; }
    .add-row label { position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0 0 0 0); }
    .add-row input { flex:1; min-width:0; min-height:50px; padding:0 16px; font:inherit; font-weight:700; color:var(--ink);
      background:var(--surface); border:var(--bw) solid var(--ink); }
    .add-row input::placeholder { color:var(--muted); font-weight:500; }
    .add-row input:focus { outline:none; box-shadow:var(--sh-s); background:var(--yellow); }

    #toast { position:fixed; left:50%; bottom:max(24px, env(safe-area-inset-bottom)); z-index:100; display:flex; align-items:center;
      max-width:calc(100vw - 32px); background:var(--ink); color:var(--yellow); padding:12px 22px; font-weight:800;
      border:var(--bw) solid var(--ink); box-shadow:4px 4px 0 var(--pink);
      transform:translate(-50%,100px); opacity:0; pointer-events:none; transition:transform .3s var(--ease), opacity .3s; }
    #toast.show { transform:translate(-50%,0); opacity:1; }

    @media (max-width:480px) {
      .wrap { padding-top:22px; }
      .card, .hero { padding:18px 16px; }
      .actions .btn { flex:1 1 100%; }
    }
    @media (prefers-reduced-motion:reduce) { *, *::before, *::after { animation-duration:.01ms !important; transition-duration:.01ms !important; } }
  </style>
</head>
<body>

<!-- SVG icon sprite -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="i-dice" viewBox="0 0 24 24"><rect x="3.5" y="3.5" width="17" height="17" rx="4"/><circle cx="8.5" cy="8.5" r=".6"/><circle cx="15.5" cy="8.5" r=".6"/><circle cx="12" cy="12" r=".6"/><circle cx="8.5" cy="15.5" r=".6"/><circle cx="15.5" cy="15.5" r=".6"/></symbol>
  <symbol id="i-reset" viewBox="0 0 24 24"><path d="M3 12a9 9 0 1 0 3-6.7"/><path d="M3 4v5h5"/></symbol>
  <symbol id="i-chart" viewBox="0 0 24 24"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></symbol>
  <symbol id="i-list" viewBox="0 0 24 24"><path d="M9 6h12M9 12h12M9 18h12"/><circle cx="4.5" cy="6" r="1"/><circle cx="4.5" cy="12" r="1"/><circle cx="4.5" cy="18" r="1"/></symbol>
  <symbol id="i-users" viewBox="0 0 24 24"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c.6-3.6 3.2-5.5 6.5-5.5s5.9 1.9 6.5 5.5"/><path d="M16 4.7a3.5 3.5 0 0 1 0 6.6M18 14.8c2 .6 3.2 2.3 3.5 5.2"/></symbol>
  <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
  <symbol id="i-x" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></symbol>
  <symbol id="i-check" viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5"/></symbol>
  <symbol id="i-info" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 11v5M12 8h.01"/></symbol>
  <symbol id="i-trophy" viewBox="0 0 24 24"><path d="M8 4h8v6a4 4 0 0 1-8 0V4zM8 6H4v1a4 4 0 0 0 4 4M16 6h4v1a4 4 0 0 1-4 4M12 14v4M8 20h8"/></symbol>
</svg>

<main class="wrap">
  <header>
    <span class="eyebrow"><svg class="i" style="width:14px;height:14px"><use href="#i-dice"/></svg>WEEKLY DUTY</span>
    <h1><span>本週值日生</span>抽籤！</h1>
    <p class="subtitle">每週從名單中隨機抽 2 位，抽出不放回，全員輪完自動開新一輪。</p>
  </header>

  <!-- Result -->
  <section class="hero" aria-labelledby="hero-label">
    <div class="hero-label" id="hero-label">本週值日生</div>
    <div id="winners" aria-live="polite">
      <span id="no-result"><svg class="i"><use href="#i-info"/></svg><span id="no-result-text">尚未抽籤，按下方按鈕開始</span></span>
    </div>
  </section>

  <div class="actions">
    <button class="btn btn-draw" id="btn-draw"><svg class="i"><use href="#i-dice"/></svg>開始抽籤</button>
    <button class="btn btn-ghost" id="btn-reset"><svg class="i"><use href="#i-reset"/></svg>重置本輪</button>
  </div>

  <div class="grid">
    <!-- Progress + history -->
    <section class="card" aria-labelledby="t-progress">
      <h2 class="card-title" id="t-progress"><svg class="i"><use href="#i-chart"/></svg>本輪進度</h2>
      <div class="progress-head">
        <div class="progress-num"><span id="drawn-ct">0</span><small> / <span id="total-ct">0</span> 人</small></div>
        <div class="progress-pct" id="progress-pct">0%</div>
      </div>
      <div class="progress-wrap" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" id="progress-wrap" aria-label="本輪抽籤進度">
        <div class="progress-bar" id="progress-bar"></div>
      </div>

      <div class="divider"></div>
      <h2 class="card-title"><svg class="i"><use href="#i-list"/></svg>抽籤紀錄</h2>
      <ul id="history-list"><li><span class="empty-hint">尚無紀錄</span></li></ul>
    </section>

    <!-- Members -->
    <section class="card" aria-labelledby="t-members">
      <h2 class="card-title" id="t-members"><svg class="i"><use href="#i-users"/></svg>人員名單<span class="count" id="member-count">0 人</span></h2>
      <div id="member-grid"></div>
      <form class="add-row" id="add-form" autocomplete="off">
        <label for="new-name">員工姓名</label>
        <input type="text" id="new-name" placeholder="輸入員工姓名…" maxlength="20" />
        <button type="submit" class="btn btn-brand" id="btn-add"><svg class="i"><use href="#i-plus"/></svg>新增</button>
      </form>
    </section>
  </div>
</main>

<div id="toast" role="status" aria-live="polite"></div>

<script>
(function () {
  // ── State ──────────────────────────────────────────────
  const DEMO = ['王小明','李美玲','張志豪','陳雅婷','林建宏','黃淑芬','吳俊德'];
  let members  = [...DEMO];
  let pool     = [];
  let drawn    = new Set();
  let history  = [];
  let roundNum = 1;
  let drawing  = false;

  // ── DOM refs ──────────────────────────────────────────
  const $ = id => document.getElementById(id);
  const winnersEl    = $('winners');
  const noResultEl   = $('no-result');
  const noResultText = $('no-result-text');
  const progressBar  = $('progress-bar');
  const progressWrap = $('progress-wrap');
  const historyList  = $('history-list');
  const memberGrid   = $('member-grid');
  const newNameInput = $('new-name');
  const toastEl      = $('toast');
  const drawBtn      = $('btn-draw');
  const reducedMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;
  let toastTimer;

  const icon = id => {
    const s = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
    s.setAttribute('class', 'i');
    s.setAttribute('aria-hidden', 'true');
    const u = document.createElementNS('http://www.w3.org/2000/svg', 'use');
    u.setAttribute('href', '#i-' + id);
    s.appendChild(u);
    return s;
  };
  const initial = name => Array.from(name)[0] || '?';

  // ── Init ──────────────────────────────────────────────
  resetPool();
  renderMembers();
  renderProgress();

  // ── Draw ──────────────────────────────────────────────
  drawBtn.addEventListener('click', draw);
  $('btn-reset').addEventListener('click', () => {
    if (drawing) return;
    if (!confirm('確定要重置本輪抽籤進度嗎？')) return;
    resetPool();
    clearResult('已重置，按下方按鈕重新抽籤');
    renderMembers();
    renderProgress();
    showToast('已重置本輪');
  });

  function draw() {
    if (drawing) return;
    if (members.length < 2) {
      showToast('人員不足 2 人，請先新增成員');
      return;
    }
    if (pool.length < 2) {
      resetPool();
      showToast('所有人都抽過了，自動開始新一輪');
    }

    const picked = [];
    for (let i = 0; i < 2; i++) {
      const idx = Math.floor(Math.random() * pool.length);
      picked.push(pool.splice(idx, 1)[0]);
    }
    picked.forEach(n => drawn.add(n));
    history.unshift({ round: roundNum++, names: picked });

    const finish = () => {
      showWinners(picked);
      renderMembers();
      renderProgress();
      renderHistory();
      drawing = false;
      drawBtn.disabled = false;
    };

    if (reducedMotion) return finish();

    // 短暫洗牌動畫，結果在動畫前已決定
    drawing = true;
    drawBtn.disabled = true;
    const all = members.length ? members : picked;
    let ticks = 0;
    const timer = setInterval(() => {
      showWinners([all[Math.floor(Math.random() * all.length)], all[Math.floor(Math.random() * all.length)]], true);
      if (++ticks >= 9) { clearInterval(timer); finish(); }
    }, 80);
  }

  function winnerCard(name, shuffling) {
    const w = document.createElement('div');
    w.className = 'winner' + (shuffling ? ' shuffling' : '');
    const av = document.createElement('span');
    av.className = 'av';
    av.textContent = initial(name);
    const nm = document.createElement('span');
    nm.className = 'nm';
    nm.textContent = name;
    w.append(av, nm);
    return w;
  }

  function showWinners(names, shuffling) {
    winnersEl.replaceChildren(...names.map(n => {
      const c = winnerCard(n, shuffling);
      if (shuffling) c.style.animation = 'none';
      return c;
    }));
  }

  function clearResult(msg) {
    noResultText.textContent = msg;
    winnersEl.replaceChildren(noResultEl);
  }

  // ── Pool ──────────────────────────────────────────────
  function resetPool() {
    pool  = [...members];
    drawn = new Set();
  }

  // ── Progress ──────────────────────────────────────────
  function renderProgress() {
    const total   = members.length;
    const drawnCt = drawn.size;
    const pct     = total === 0 ? 0 : Math.round((drawnCt / total) * 100);
    progressBar.style.width = pct + '%';
    progressWrap.setAttribute('aria-valuenow', pct);
    $('drawn-ct').textContent = drawnCt;
    $('total-ct').textContent = total;
    $('progress-pct').textContent = pct + '%';
    $('member-count').textContent = total + ' 人';
  }

  // ── History ───────────────────────────────────────────
  function renderHistory() {
    historyList.replaceChildren();
    if (history.length === 0) {
      const li = document.createElement('li');
      li.innerHTML = '<span class="empty-hint">尚無紀錄</span>';
      historyList.appendChild(li);
      return;
    }
    history.forEach(h => {
      const li = document.createElement('li');
      const names = document.createElement('span');
      names.className = 'hist-names';
      names.textContent = h.names.join('、');
      const round = document.createElement('span');
      round.className = 'hist-round';
      round.textContent = `第 ${h.round} 輪`;
      li.append(names, round);
      historyList.appendChild(li);
    });
  }

  // ── Members ───────────────────────────────────────────
  function renderMembers() {
    memberGrid.replaceChildren();
    if (members.length === 0) {
      const s = document.createElement('span');
      s.className = 'empty-hint';
      s.textContent = '名單為空，請新增成員';
      memberGrid.appendChild(s);
      return;
    }
    members.forEach(name => {
      const tag = document.createElement('span');
      tag.className = 'member' + (drawn.has(name) ? ' drawn' : '');

      const av = document.createElement('span');
      av.className = 'av';
      av.textContent = initial(name);

      const nm = document.createElement('span');
      nm.className = 'nm';
      nm.textContent = name;

      const st = document.createElement('span');
      st.className = 'st';
      st.append(icon('check'), '已抽');

      const rm = document.createElement('button');
      rm.type = 'button';
      rm.className = 'rm';
      rm.setAttribute('aria-label', '移除 ' + name);
      rm.title = '移除 ' + name;
      rm.appendChild(icon('x'));
      rm.addEventListener('click', () => removeMember(name));

      tag.append(av, nm, st, rm);
      memberGrid.appendChild(tag);
    });
  }

  // ── Add / Remove ──────────────────────────────────────
  $('add-form').addEventListener('submit', e => { e.preventDefault(); addMember(); });

  function addMember() {
    const name = newNameInput.value.trim();
    if (!name) { showToast('請輸入姓名'); newNameInput.focus(); return; }
    if (members.includes(name)) { showToast(`「${name}」已在名單中`); return; }
    members.push(name);
    pool.push(name);
    newNameInput.value = '';
    renderMembers();
    renderProgress();
    showToast(`已新增「${name}」`);
    newNameInput.focus();
  }

  function removeMember(name) {
    if (!confirm(`確定要移除「${name}」嗎？`)) return;
    members = members.filter(m => m !== name);
    pool    = pool.filter(m => m !== name);
    drawn.delete(name);

    winnersEl.querySelectorAll('.winner').forEach(c => {
      if (c.querySelector('.nm').textContent === name) c.remove();
    });
    if (winnersEl.children.length === 0) clearResult('已移除當前值日生，請重新抽籤');
    renderMembers();
    renderProgress();
    showToast(`已移除「${name}」`);
  }

  // ── Toast ─────────────────────────────────────────────
  function showToast(msg) {
    clearTimeout(toastTimer);
    toastEl.textContent = msg;
    toastEl.classList.add('show');
    toastTimer = setTimeout(() => toastEl.classList.remove('show'), 2800);
  }
})();
</script>
</body>
</html>
