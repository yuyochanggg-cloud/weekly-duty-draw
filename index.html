<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>值日生抽籤</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg:#fffdf5; --ink:#111111; --muted:#4a4a4a; --surface:#ffffff; --surface-2:#f1ede0;
      --yellow:#ffe14d; --pink:#ff7aa8; --mint:#59e0b8; --blue:#8fb2ff;
      --bw:3px; --sh:5px 5px 0 var(--ink); --sh-s:3px 3px 0 var(--ink);
      --font:'Noto Sans TC','PingFang TC','Microsoft JhengHei','Segoe UI',system-ui,sans-serif;
      --ease:cubic-bezier(.22,.8,.3,1);
    }
    html { color-scheme: light; }
    body { font-family:var(--font); color:var(--ink); min-height:100dvh; line-height:1.6; font-size:16px;
      background-color:var(--bg); background-image:radial-gradient(#11111122 1.2px, transparent 1.2px); background-size:22px 22px; }
    .wrap { max-width:960px; margin:0 auto; padding:36px 16px 96px; }
    svg.i { width:20px; height:20px; flex:none; stroke:currentColor; fill:none; stroke-width:2.4; stroke-linecap:round; stroke-linejoin:round; }
    :focus-visible { outline:4px solid var(--blue); outline-offset:3px; }

    header { margin-bottom:28px; }
    .eyebrow { display:inline-flex; align-items:center; gap:8px; font-size:.8rem; font-weight:900; letter-spacing:.12em;
      background:var(--mint); border:var(--bw) solid var(--ink); padding:3px 12px; box-shadow:var(--sh-s); margin-bottom:14px; transform:rotate(-2deg); }
    h1 { font-size:clamp(2rem,6vw,3.2rem); font-weight:900; line-height:1.1; letter-spacing:-.02em; }
    h1 span { background:linear-gradient(transparent 58%, var(--yellow) 58%); }
    .subtitle { margin-top:10px; font-weight:500; color:var(--muted); }

    .hero { background:var(--yellow); border:var(--bw) solid var(--ink); box-shadow:8px 8px 0 var(--ink);
      padding:24px; margin-bottom:28px; position:relative; }
    .hero-label { display:inline-block; font-weight:900; font-size:.9rem; letter-spacing:.1em; background:var(--ink); color:var(--yellow);
      padding:2px 12px; margin-bottom:18px; }
    .next-draw-note { margin-top:16px; border-top:2px dashed var(--ink); padding-top:10px; font-size:.92rem; font-weight:800; }
    #winners { display:grid; grid-template-columns:repeat(auto-fit,minmax(170px,1fr)); gap:16px; min-height:92px; }
    .winner { display:flex; align-items:center; gap:14px; background:var(--surface); border:var(--bw) solid var(--ink);
      box-shadow:var(--sh-s); padding:14px 16px; animation:slam .35s var(--ease) both; }
    .winner:nth-child(2) { background:var(--pink); animation-delay:.07s; }
    .winner .av { width:50px; height:50px; background:var(--ink); color:var(--yellow); display:grid; place-items:center;
      font-size:1.4rem; font-weight:900; flex:none; }
    .winner .nm { font-size:1.5rem; font-weight:900; overflow-wrap:anywhere; line-height:1.2; }
    .winner.shuffling .nm { opacity:.5; }
    #no-result { grid-column:1/-1; display:flex; align-items:center; gap:10px; font-weight:700; }
    @keyframes slam { from { transform:translate(-8px,-12px) rotate(-3deg); opacity:0; } to { transform:none; opacity:1; } }

    .btn { display:inline-flex; align-items:center; justify-content:center; gap:8px; min-height:50px; padding:0 22px;
      font:inherit; font-weight:900; color:var(--ink); background:var(--surface); border:var(--bw) solid var(--ink);
      box-shadow:var(--sh-s); cursor:pointer; touch-action:manipulation;
      transition:transform .12s var(--ease), box-shadow .12s var(--ease), background-color .12s; }
    .btn:hover:not(:disabled) { transform:translate(-2px,-2px); box-shadow:5px 5px 0 var(--ink); }
    .btn:active:not(:disabled) { transform:translate(3px,3px); box-shadow:0 0 0 var(--ink); }
    .btn:disabled { opacity:.45; cursor:not-allowed; box-shadow:none; }
    .btn-draw { background:var(--pink); font-size:1.15rem; min-height:60px; padding:0 34px; box-shadow:var(--sh); }
    .btn-ghost:hover:not(:disabled) { background:var(--surface-2); }
    .btn-brand { background:var(--blue); }
    .actions { display:flex; gap:16px; flex-wrap:wrap; justify-content:center; margin-bottom:36px; }

    .grid { display:grid; gap:24px; grid-template-columns:minmax(0,1fr); align-items:start; }
    @media (min-width:800px) { .grid { grid-template-columns:repeat(2,minmax(0,1fr)); } }
    .card { background:var(--surface); border:var(--bw) solid var(--ink); box-shadow:var(--sh); padding:24px; }
    .card-title { display:flex; align-items:center; gap:10px; font-size:1.1rem; font-weight:900; margin-bottom:16px; }
    .card-title .count { margin-left:auto; font-size:.8rem; background:var(--yellow); border:2px solid var(--ink); padding:0 10px; font-variant-numeric:tabular-nums; }

    .progress-head { display:flex; justify-content:space-between; align-items:baseline; margin-bottom:10px; }
    .progress-num { font-size:2.6rem; font-weight:900; line-height:1; font-variant-numeric:tabular-nums; }
    .progress-num small { font-size:1rem; color:var(--muted); font-weight:700; }
    .progress-pct { font-weight:900; font-variant-numeric:tabular-nums; }
    .progress-wrap { height:22px; border:var(--bw) solid var(--ink); background:var(--surface); }
    .progress-bar { height:100%; width:0; background:repeating-linear-gradient(45deg,var(--mint) 0 10px,#3fc79e 10px 20px);
      border-right:var(--bw) solid var(--ink); transition:width .5s var(--ease); }
    .divider { height:var(--bw); background:var(--ink); margin:24px 0 20px; }

    #history-list { list-style:none; max-height:320px; overflow-y:auto; }
    #history-list li { display:grid; grid-template-columns:minmax(0,1fr) auto; gap:4px 12px; align-items:start; padding:12px 0; border-bottom:2px dashed var(--ink); }
    #history-list li:last-child { border-bottom:0; }
    #history-list .history-empty { display:block; }
    .hist-date { font-size:.86rem; font-weight:900; }
    .hist-draw-date { font-size:.76rem; font-weight:600; color:var(--muted); }
    .hist-names { font-weight:800; overflow-wrap:anywhere; }
    .hist-meta { grid-column:2; grid-row:1/4; display:flex; flex-direction:column; align-items:flex-end; gap:5px; }
    .hist-round { font-size:.78rem; font-weight:800; white-space:nowrap; background:var(--blue); border:2px solid var(--ink); padding:0 8px; }
    .hist-carry, .hist-solo { font-size:.72rem; font-weight:900; white-space:nowrap; border:2px solid var(--ink); padding:0 7px; }
    .hist-carry { background:var(--pink); }
    .hist-solo { background:var(--mint); }
    .history-controls { display:flex; align-items:center; justify-content:space-between; gap:8px; margin:-4px 0 8px; }
    .history-controls .btn { min-height:40px; padding:0 10px; font-size:.82rem; }
    .history-week { flex:1; min-width:0; text-align:center; font-size:.86rem; font-weight:900; }
    .empty-hint { color:var(--muted); font-weight:500; }
    .privacy-note { margin:8px 0 4px; color:var(--muted); font-size:.78rem; line-height:1.5; }
    .data-tools { margin-top:12px; border-top:2px dashed var(--ink); padding-top:10px; }
    .data-tools summary { cursor:pointer; font-weight:900; min-height:40px; display:flex; align-items:center; }
    .data-actions { display:flex; flex-wrap:wrap; gap:8px; margin-top:8px; }
    .data-actions .btn { min-height:44px; padding:0 12px; font-size:.86rem; }
    .btn-danger { background:var(--pink); }

    #member-grid { display:flex; flex-wrap:wrap; gap:10px; margin-bottom:22px; }
    .member { display:inline-flex; align-items:center; gap:8px; padding:5px 5px 5px 6px; background:var(--surface);
      border:2px solid var(--ink); box-shadow:2px 2px 0 var(--ink); font-weight:800; }
    .member .av { width:30px; height:30px; background:var(--yellow); border:2px solid var(--ink); display:grid; place-items:center; font-size:.85rem; font-weight:900; }
    .member .st { display:none; align-items:center; gap:3px; font-size:.75rem; font-weight:900; background:var(--mint); border:2px solid var(--ink); padding:0 8px; }
    .member .st .i { width:13px; height:13px; stroke-width:3.2; }
    .member .duty-count { flex:none; font-size:.72rem; font-weight:900; white-space:nowrap; background:var(--yellow);
      border:2px solid var(--ink); padding:0 6px; font-variant-numeric:tabular-nums; }
    .member.drawn { background:var(--surface-2); box-shadow:none; }
    .member.drawn .st { display:inline-flex; }
    .member.drawn .nm { color:var(--muted); }
    .rm { position:relative; width:30px; height:30px; border:2px solid transparent; background:transparent; color:var(--ink); cursor:pointer; display:grid; place-items:center; }
    .rm::after { content:""; position:absolute; inset:-7px; }
    .rm:hover { background:var(--pink); border-color:var(--ink); }
    .rm .i { width:16px; height:16px; stroke-width:3; }

    .add-row { display:flex; gap:12px; }
    .add-row label { position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0 0 0 0); }
    .add-row input { flex:1; min-width:0; min-height:50px; padding:0 16px; font:inherit; font-weight:700; color:var(--ink);
      background:var(--surface); border:var(--bw) solid var(--ink); }
    .add-row input::placeholder { color:var(--muted); font-weight:500; }
    .add-row input:focus { outline:none; box-shadow:var(--sh-s); background:var(--yellow); }
    .member-note { margin:-8px 0 14px; color:var(--muted); font-size:.8rem; }
    .baseline-note { margin:4px 0 10px; color:var(--muted); font-size:.82rem; }
    .baseline-list { display:grid; gap:8px; margin:10px 0 12px; }
    .baseline-row { display:grid; grid-template-columns:minmax(0,1fr) auto; align-items:center; gap:4px 12px;
      background:var(--surface-2); border:2px solid var(--ink); padding:8px 10px; }
    .baseline-name { font-weight:900; overflow-wrap:anywhere; }
    .baseline-total { color:var(--muted); font-size:.78rem; font-weight:700; }
    .baseline-input { display:flex; align-items:center; gap:8px; font-weight:800; white-space:nowrap; }
    .baseline-input input { width:92px; min-height:44px; padding:0 8px; text-align:right; font:inherit; font-variant-numeric:tabular-nums;
      color:var(--ink); background:var(--surface); border:2px solid var(--ink); }
    .baseline-submit { margin-top:4px; }

    #toast { position:fixed; left:50%; bottom:max(24px, env(safe-area-inset-bottom)); z-index:100; display:flex; align-items:center;
      max-width:calc(100vw - 32px); background:var(--ink); color:var(--yellow); padding:12px 22px; font-weight:800;
      border:var(--bw) solid var(--ink); box-shadow:4px 4px 0 var(--pink);
      transform:translate(-50%,100px); opacity:0; pointer-events:none; transition:transform .3s var(--ease), opacity .3s; }
    #toast.show { transform:translate(-50%,0); opacity:1; }

    @media (max-width:480px) {
      .wrap { padding-top:22px; }
      .card, .hero { padding:18px 16px; }
      .actions .btn { flex:1 1 100%; }
    }
    @media (prefers-reduced-motion:reduce) { *, *::before, *::after { animation-duration:.01ms !important; transition-duration:.01ms !important; } }
  </style>
</head>
<body>

<!-- SVG icon sprite -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="i-dice" viewBox="0 0 24 24"><rect x="3.5" y="3.5" width="17" height="17" rx="4"/><circle cx="8.5" cy="8.5" r=".6"/><circle cx="15.5" cy="8.5" r=".6"/><circle cx="12" cy="12" r=".6"/><circle cx="8.5" cy="15.5" r=".6"/><circle cx="15.5" cy="15.5" r=".6"/></symbol>
  <symbol id="i-reset" viewBox="0 0 24 24"><path d="M3 12a9 9 0 1 0 3-6.7"/><path d="M3 4v5h5"/></symbol>
  <symbol id="i-chart" viewBox="0 0 24 24"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></symbol>
  <symbol id="i-list" viewBox="0 0 24 24"><path d="M9 6h12M9 12h12M9 18h12"/><circle cx="4.5" cy="6" r="1"/><circle cx="4.5" cy="12" r="1"/><circle cx="4.5" cy="18" r="1"/></symbol>
  <symbol id="i-users" viewBox="0 0 24 24"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c.6-3.6 3.2-5.5 6.5-5.5s5.9 1.9 6.5 5.5"/><path d="M16 4.7a3.5 3.5 0 0 1 0 6.6M18 14.8c2 .6 3.2 2.3 3.5 5.2"/></symbol>
  <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
  <symbol id="i-x" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></symbol>
  <symbol id="i-check" viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5"/></symbol>
  <symbol id="i-info" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 11v5M12 8h.01"/></symbol>
  <symbol id="i-trophy" viewBox="0 0 24 24"><path d="M8 4h8v6a4 4 0 0 1-8 0V4zM8 6H4v1a4 4 0 0 0 4 4M16 6h4v1a4 4 0 0 1-4 4M12 14v4M8 20h8"/></symbol>
</svg>

<main class="wrap">
  <header>
    <span class="eyebrow"><svg class="i" style="width:14px;height:14px"><use href="#i-dice"/></svg>WEEKLY DUTY</span>
    <h1><span>值日生</span>抽籤！</h1>
    <p class="subtitle">每週安排 2 位；本輪最後 1 人會遞延到下週，優先與值勤次數較少的成員配對。</p>
  </header>

  <!-- Result -->
  <section class="hero" aria-labelledby="hero-label">
    <div class="hero-label" id="hero-label">下週值日生</div>
    <div id="winners" aria-live="polite">
      <span id="no-result"><svg class="i"><use href="#i-info"/></svg><span id="no-result-text">尚未抽出值日生，按下方按鈕開始</span></span>
    </div>
    <p class="next-draw-note" id="next-draw-note" aria-live="polite"></p>
  </section>

  <div class="actions">
    <button class="btn btn-draw" id="btn-draw"><svg class="i"><use href="#i-dice"/></svg>開始抽籤</button>
    <button class="btn btn-ghost" id="btn-reset"><svg class="i"><use href="#i-reset"/></svg>重置本輪</button>
  </div>

  <div class="grid">
    <!-- Progress + history -->
    <section class="card" aria-labelledby="t-progress">
      <h2 class="card-title" id="t-progress"><svg class="i"><use href="#i-chart"/></svg>本輪進度</h2>
      <div class="progress-head">
        <div class="progress-num"><span id="drawn-ct">0</span><small> / <span id="total-ct">0</span> 人</small></div>
        <div class="progress-pct" id="progress-pct">0%</div>
      </div>
      <div class="progress-wrap" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" id="progress-wrap" aria-label="本輪抽籤進度">
        <div class="progress-bar" id="progress-bar"></div>
      </div>

      <div class="divider"></div>
      <h2 class="card-title"><svg class="i"><use href="#i-list"/></svg>抽籤紀錄</h2>
      <div class="history-controls" aria-label="歷史紀錄週次">
        <button class="btn btn-ghost" id="history-prev" type="button" aria-label="查看較早一週">‹ 上一週</button>
        <div class="history-week" id="history-week" aria-live="polite"></div>
        <button class="btn btn-ghost" id="history-next" type="button" aria-label="查看較新一週">下一週 ›</button>
      </div>
      <ul id="history-list" aria-live="polite"><li class="history-empty"><span class="empty-hint">尚無紀錄</span></li></ul>
      <p class="privacy-note">名單、進度與紀錄只存在這個瀏覽器；換裝置可匯出備份再匯入。</p>
      <details class="data-tools">
        <summary>備份與資料管理</summary>
        <div class="data-actions">
          <button class="btn btn-ghost" id="btn-export" type="button">匯出 JSON 備份</button>
          <button class="btn btn-ghost" id="btn-export-md" type="button">匯出 Markdown 紀錄</button>
          <button class="btn btn-ghost" id="btn-import" type="button">匯入備份</button>
          <input id="import-file" type="file" accept="application/json,.json" hidden />
          <button class="btn btn-danger" id="btn-clear" type="button">清除所有資料</button>
        </div>
      </details>
    </section>

    <!-- Members -->
    <section class="card" aria-labelledby="t-members">
      <h2 class="card-title" id="t-members"><svg class="i"><use href="#i-users"/></svg>人員名單<span class="count" id="member-count">0 人</span></h2>
      <p class="member-note">姓名旁的數字是累積值日次數。</p>
      <div id="member-grid"></div>
      <form class="add-row" id="add-form" autocomplete="off">
        <label for="new-name">員工姓名</label>
        <input type="text" id="new-name" placeholder="輸入員工姓名…" maxlength="20" />
        <button type="submit" class="btn btn-brand" id="btn-add"><svg class="i"><use href="#i-plus"/></svg>新增</button>
      </form>
      <details class="data-tools baseline-tools">
        <summary>補登網站上線前次數</summary>
        <p class="baseline-note">填入每個人開始使用網站前已值日幾次。姓名旁的累積總數會加上網站抽籤紀錄；補登次數也會用於遞延配對，不會新增虛構日期。</p>
        <form id="baseline-form">
          <div class="baseline-list" id="baseline-list"></div>
          <button type="submit" class="btn btn-brand baseline-submit" id="btn-baseline-save">儲存補登次數</button>
        </form>
      </details>
    </section>
  </div>
</main>

<div id="toast" role="status" aria-live="polite"></div>

<script>
(function () {
  const DEMO = ['王小明','李美玲','張志豪','陳雅婷','林建宏','黃淑芬','吳俊德'];
  const STORAGE_KEY = 'weekly-duty-draw.v1';
  const STORAGE_VERSION = 1;
  const WEEKDAYS = ['日','一','二','三','四','五','六'];

  let members = [...DEMO];
  let pool = [...DEMO];
  let drawn = new Set();
  let history = [];
  let baselineCounts = Object.create(null);
  let roundNum = 1;
  let drawCount = 0;
  let currentWinners = [];
  let currentWinnersWeek = null;
  let drawing = false;
  let toastTimer;
  let storageWarningShown = false;
  let startupNotice = '';
  let historyWeekStart = null;

  const $ = id => document.getElementById(id);
  const winnersEl = $('winners');
  const noResultEl = $('no-result');
  const noResultText = $('no-result-text');
  const progressBar = $('progress-bar');
  const progressWrap = $('progress-wrap');
  const historyList = $('history-list');
  const memberGrid = $('member-grid');
  const newNameInput = $('new-name');
  const toastEl = $('toast');
  const drawBtn = $('btn-draw');
  const reducedMotion = window.matchMedia ? window.matchMedia('(prefers-reduced-motion: reduce)').matches : false;

  function localDateISO(date) {
    const d = date || new Date();
    const y = d.getFullYear();
    const m = String(d.getMonth() + 1).padStart(2, '0');
    const day = String(d.getDate()).padStart(2, '0');
    return y + '-' + m + '-' + day;
  }

  function parseDate(iso) {
    const parts = String(iso).split('-').map(Number);
    return new Date(parts[0], parts[1] - 1, parts[2], 12);
  }

  function isValidDate(iso) {
    return typeof iso === 'string' && /^\d{4}-\d{2}-\d{2}$/.test(iso) && localDateISO(parseDate(iso)) === iso;
  }

  function weekStart(date) {
    const d = new Date(date.getFullYear(), date.getMonth(), date.getDate(), 12);
    const offset = (d.getDay() + 6) % 7;
    d.setDate(d.getDate() - offset);
    return d;
  }

  function nextDutyWeekStart(date) {
    const start = weekStart(date);
    start.setDate(start.getDate() + 7);
    return start;
  }

  function nextDrawDutyWeekStart(date) {
    const currentWeek = weekStart(date);
    const currentWeekISO = localDateISO(currentWeek);
    const latestScheduledWeek = history.reduce((latest, item) => {
      if (!isValidDate(item.dutyWeekStart)) return latest;
      return !latest || item.dutyWeekStart > latest ? item.dutyWeekStart : latest;
    }, null);
    // 排在「本週或最近已排週」之後一週；未抽的排程週不會被重複使用。
    const anchorWeek = latestScheduledWeek && latestScheduledWeek > currentWeekISO
      ? parseDate(latestScheduledWeek) : currentWeek;
    return nextDutyWeekStart(anchorWeek);
  }

  function weekLabel(start) {
    return formatDutyWeek(localDateISO(start));
  }

  function formatDutyWeek(iso) {
    const start = parseDate(iso);
    const end = new Date(start);
    end.setDate(end.getDate() + 6);
    const left = start.getFullYear() + '/' + String(start.getMonth() + 1).padStart(2, '0') + '/' +
      String(start.getDate()).padStart(2, '0');
    const right = start.getFullYear() === end.getFullYear()
      ? String(end.getMonth() + 1).padStart(2, '0') + '/' + String(end.getDate()).padStart(2, '0')
      : end.getFullYear() + '/' + String(end.getMonth() + 1).padStart(2, '0') + '/' + String(end.getDate()).padStart(2, '0');
    return left + '–' + right;
  }

  function formatDate(iso) {
    const d = parseDate(iso);
    return d.getFullYear() + '/' + String(d.getMonth() + 1).padStart(2, '0') + '/' +
      String(d.getDate()).padStart(2, '0') + '（' + WEEKDAYS[d.getDay()] + '）';
  }

  function createId() {
    if (window.crypto && typeof window.crypto.randomUUID === 'function') return window.crypto.randomUUID();
    return Date.now().toString(36) + '-' + Math.random().toString(36).slice(2, 10);
  }

  function normalizeNames(list) {
    if (!Array.isArray(list)) return [];
    const result = [];
    list.forEach(value => {
      if (typeof value !== 'string') return;
      const name = value.trim();
      if (name && !result.includes(name)) result.push(name);
    });
    return result;
  }

  function normalizeBaselineCounts(counts) {
    const result = Object.create(null);
    if (!counts || typeof counts !== 'object' || Array.isArray(counts)) return result;
    Object.keys(counts).forEach(rawName => {
      const name = rawName.trim();
      const count = counts[rawName];
      if (name && Number.isSafeInteger(count) && count >= 0) result[name] = count;
    });
    return result;
  }

  function normalizeHistory(record, index) {
    if (!record || typeof record !== 'object' || !Array.isArray(record.names)) return null;
    const names = normalizeNames(record.names);
    if (!names.length) return null;
    const date = isValidDate(record.date) ? record.date : localDateISO(new Date());
    const inferredDutyWeek = localDateISO(nextDutyWeekStart(parseDate(date)));
    const dutyWeekStart = isValidDate(record.dutyWeekStart)
      ? localDateISO(weekStart(parseDate(record.dutyWeekStart))) : inferredDutyWeek;
    const round = Number.isInteger(record.round) && record.round > 0 ? record.round : 1;
    const draw = Number.isInteger(record.draw) && record.draw > 0 ? record.draw : index + 1;
    return {
      id: typeof record.id === 'string' && record.id ? record.id : createId(),
      round: round,
      draw: draw,
      date: date,
      dutyWeekStart: dutyWeekStart,
      names: names,
      carryover: record.carryover === true,
      solo: record.solo === true || names.length === 1
    };
  }

  function normalizeState(state) {
    if (!state || typeof state !== 'object' || state.version !== STORAGE_VERSION ||
        !Array.isArray(state.members) || !Array.isArray(state.pool) ||
        !Array.isArray(state.drawn) || !Array.isArray(state.history)) {
      throw new Error('備份格式或版本不支援');
    }
    const nextMembers = normalizeNames(state.members);
    const nextDrawn = new Set(normalizeNames(state.drawn).filter(name => nextMembers.includes(name)));
    const nextPool = normalizeNames(state.pool).filter(name => nextMembers.includes(name) && !nextDrawn.has(name));
    nextMembers.forEach(name => {
      if (!nextDrawn.has(name) && !nextPool.includes(name)) nextPool.push(name);
    });
    const nextHistory = state.history.map((record, index) => normalizeHistory(record, index))
      .filter(Boolean)
      .sort((a, b) => b.dutyWeekStart.localeCompare(a.dutyWeekStart) ||
        b.date.localeCompare(a.date) || b.draw - a.draw);
    const maxHistoryDraw = nextHistory.reduce((max, item) => Math.max(max, item.draw), 0);
    const nextRound = Number.isInteger(state.roundNum) && state.roundNum > 0 ? state.roundNum : 1;
    const nextDrawCount = Number.isInteger(state.drawCount) && state.drawCount >= 0
      ? Math.max(state.drawCount, maxHistoryDraw) : Math.max(nextHistory.length, maxHistoryDraw);
    const nextWinners = normalizeNames(state.currentWinners).filter(name => nextMembers.includes(name));
    const inferredWinnersWeek = nextWinners.length && nextHistory.length ? nextHistory[0].dutyWeekStart : null;
    const nextWinnersWeek = isValidDate(state.currentWinnersWeek)
      ? localDateISO(weekStart(parseDate(state.currentWinnersWeek))) : inferredWinnersWeek;
    return {
      members: nextMembers,
      pool: nextPool,
      drawn: nextDrawn,
      history: nextHistory,
      baselineCounts: normalizeBaselineCounts(state.baselineCounts),
      roundNum: nextRound,
      drawCount: nextDrawCount,
      currentWinners: nextWinners,
      currentWinnersWeek: nextWinnersWeek
    };
  }

  function applyState(state) {
    members = state.members;
    pool = state.pool;
    drawn = state.drawn;
    history = state.history;
    baselineCounts = state.baselineCounts;
    roundNum = state.roundNum;
    drawCount = state.drawCount;
    currentWinners = state.currentWinners;
    currentWinnersWeek = state.currentWinnersWeek;
  }

  function resetToDemo() {
    members = [...DEMO];
    pool = [...DEMO];
    drawn = new Set();
    history = [];
    baselineCounts = Object.create(null);
    roundNum = 1;
    drawCount = 0;
    currentWinners = [];
    currentWinnersWeek = null;
  }

  function loadState() {
    try {
      const raw = localStorage.getItem(STORAGE_KEY);
      if (!raw) return;
      applyState(normalizeState(JSON.parse(raw)));
    } catch (error) {
      resetToDemo();
      startupNotice = '儲存資料無法讀取，已載入示範名單；可用備份檔復原。';
      storageWarningShown = true;
    }
  }

  function saveState() {
    try {
      localStorage.setItem(STORAGE_KEY, JSON.stringify({
        version: STORAGE_VERSION,
        members: members,
        pool: pool,
        drawn: Array.from(drawn),
        history: history,
        baselineCounts: baselineCounts,
        roundNum: roundNum,
        drawCount: drawCount,
        currentWinners: currentWinners,
        currentWinnersWeek: currentWinnersWeek
      }));
      return true;
    } catch (error) {
      if (!storageWarningShown) {
        showToast('瀏覽器無法儲存資料，重新整理後可能會遺失變更。');
        storageWarningShown = true;
      }
      return false;
    }
  }

  const icon = id => {
    const svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
    svg.setAttribute('class', 'i');
    svg.setAttribute('aria-hidden', 'true');
    const use = document.createElementNS('http://www.w3.org/2000/svg', 'use');
    use.setAttribute('href', '#i-' + id);
    svg.appendChild(use);
    return svg;
  };

  const initial = name => Array.from(name)[0] || '?';

  function getDutyCounts(names) {
    const counts = new Map(names.map(name => [name, baselineCounts[name] || 0]));
    history.forEach(record => record.names.forEach(name => {
      if (counts.has(name)) counts.set(name, counts.get(name) + 1);
    }));
    return counts;
  }

  function resetPool() {
    pool = [...members];
    drawn = new Set();
  }

  function renderProgress() {
    const total = members.length;
    const drawnCount = drawn.size;
    const pct = total === 0 ? 0 : Math.round((drawnCount / total) * 100);
    progressBar.style.width = pct + '%';
    progressWrap.setAttribute('aria-valuenow', pct);
    $('drawn-ct').textContent = drawnCount;
    $('total-ct').textContent = total;
    $('progress-pct').textContent = pct + '%';
    $('member-count').textContent = total + ' 人';
  }

  function renderHistory() {
    const thisWeek = weekStart(new Date());
    const calendarNextWeek = nextDutyWeekStart(new Date());
    const targetWeek = nextDrawDutyWeekStart(new Date());
    const weekMap = new Map();
    history.forEach(item => {
      const start = parseDate(item.dutyWeekStart);
      weekMap.set(localDateISO(start), start);
    });
    weekMap.set(localDateISO(calendarNextWeek), calendarNextWeek);
    weekMap.set(localDateISO(targetWeek), targetWeek);
    const weeks = Array.from(weekMap.values()).sort((a, b) => b - a);

    if (!historyWeekStart) {
      historyWeekStart = targetWeek;
    }
    let index = weeks.findIndex(start => localDateISO(start) === localDateISO(historyWeekStart));
    if (index < 0) {
      historyWeekStart = weeks[0];
      index = 0;
    }
    const pageStart = weeks[index];
    const pageKey = localDateISO(pageStart);
    const isCalendarNextWeek = pageKey === localDateISO(calendarNextWeek);
    const isTargetWeek = pageKey === localDateISO(targetWeek);
    const isThisWeek = pageKey === localDateISO(thisWeek);
    const weekNote = isCalendarNextWeek ? '・下週' : isTargetWeek ? '・下次抽籤' : isThisWeek ? '・本週' : '';
    $('history-week').textContent = weekLabel(pageStart) + weekNote;
    $('history-prev').disabled = history.length === 0 || index >= weeks.length - 1;
    $('history-next').disabled = history.length === 0 || index <= 0;

    historyList.replaceChildren();
    const items = history.filter(item => item.dutyWeekStart === pageKey);
    if (!items.length) {
      const empty = document.createElement('li');
      empty.className = 'history-empty empty-hint';
      empty.textContent = history.length ? '該週尚無抽籤紀錄' : '尚無紀錄';
      historyList.appendChild(empty);
      return;
    }

    items.forEach(item => {
      const li = document.createElement('li');
      const date = document.createElement('span');
      date.className = 'hist-date';
      date.textContent = '值勤週 ' + formatDutyWeek(item.dutyWeekStart);

      const drawDate = document.createElement('span');
      drawDate.className = 'hist-draw-date';
      drawDate.textContent = '抽籤日 ' + formatDate(item.date);

      const names = document.createElement('span');
      names.className = 'hist-names';
      names.textContent = item.names.join('、');

      const meta = document.createElement('div');
      meta.className = 'hist-meta';
      const round = document.createElement('span');
      round.className = 'hist-round';
      round.textContent = '第 ' + item.round + ' 輪 · 第 ' + item.draw + ' 次';
      meta.appendChild(round);
      if (item.carryover) {
        const carried = document.createElement('span');
        carried.className = 'hist-carry';
        carried.textContent = '含上輪遞延成員';
        meta.appendChild(carried);
      }
      if (item.solo) {
        const solo = document.createElement('span');
        solo.className = 'hist-solo';
        solo.textContent = '本輪最後 1 人';
        meta.appendChild(solo);
      }
      li.append(date, drawDate, names, meta);
      historyList.appendChild(li);
    });
  }

  function renderMembers() {
    memberGrid.replaceChildren();
    renderBaselineInputs();
    if (members.length === 0) {
      const empty = document.createElement('span');
      empty.className = 'empty-hint';
      empty.textContent = '名單為空，請新增成員';
      memberGrid.appendChild(empty);
      return;
    }
    const dutyCounts = getDutyCounts(members);
    members.forEach(name => {
      const tag = document.createElement('span');
      tag.className = 'member' + (drawn.has(name) ? ' drawn' : '');

      const avatar = document.createElement('span');
      avatar.className = 'av';
      avatar.textContent = initial(name);

      const label = document.createElement('span');
      label.className = 'nm';
      label.textContent = name;

      const dutyCount = document.createElement('span');
      dutyCount.className = 'duty-count';
      dutyCount.textContent = '累積 ' + dutyCounts.get(name) + ' 次';
      dutyCount.setAttribute('aria-label', '累積值日 ' + dutyCounts.get(name) + ' 次');

      const status = document.createElement('span');
      status.className = 'st';
      status.append(icon('check'), '已抽');

      const remove = document.createElement('button');
      remove.type = 'button';
      remove.className = 'rm';
      remove.setAttribute('aria-label', '移除 ' + name);
      remove.title = '移除 ' + name;
      remove.disabled = drawing;
      remove.appendChild(icon('x'));
      remove.addEventListener('click', () => removeMember(name));

      tag.append(avatar, label, dutyCount, status, remove);
      memberGrid.appendChild(tag);
    });
  }

  function renderBaselineInputs() {
    const list = $('baseline-list');
    const saveButton = $('btn-baseline-save');
    list.replaceChildren();
    saveButton.disabled = members.length === 0;
    if (members.length === 0) {
      const empty = document.createElement('span');
      empty.className = 'empty-hint';
      empty.textContent = '請先新增成員，再補登次數';
      list.appendChild(empty);
      return;
    }
    const dutyCounts = getDutyCounts(members);
    members.forEach(name => {
      const row = document.createElement('div');
      row.className = 'baseline-row';

      const info = document.createElement('div');
      const label = document.createElement('div');
      label.className = 'baseline-name';
      label.textContent = name;
      const total = document.createElement('div');
      total.className = 'baseline-total';
      total.textContent = '目前累積：' + dutyCounts.get(name) + ' 次';
      info.append(label, total);

      const inputLabel = document.createElement('label');
      inputLabel.className = 'baseline-input';
      inputLabel.append(document.createTextNode('上線前'));
      const input = document.createElement('input');
      input.type = 'number';
      input.min = '0';
      input.max = '999999';
      input.step = '1';
      input.required = true;
      input.inputMode = 'numeric';
      input.value = String(baselineCounts[name] || 0);
      input.setAttribute('data-member', name);
      input.setAttribute('aria-label', name + '上線前累積值日次數');
      inputLabel.appendChild(input);

      row.append(info, inputLabel);
      list.appendChild(row);
    });
  }

  function winnerCard(name, shuffling) {
    const card = document.createElement('div');
    card.className = 'winner' + (shuffling ? ' shuffling' : '');
    const avatar = document.createElement('span');
    avatar.className = 'av';
    avatar.textContent = initial(name);
    const label = document.createElement('span');
    label.className = 'nm';
    label.textContent = name;
    card.append(avatar, label);
    return card;
  }

  function showWinners(names, shuffling) {
    winnersEl.replaceChildren(...names.map(name => {
      const card = winnerCard(name, shuffling);
      if (shuffling) card.style.animation = 'none';
      return card;
    }));
  }

  function clearResult(message) {
    noResultText.textContent = message;
    winnersEl.replaceChildren(noResultEl);
  }

  function renderResultLabel() {
    const calendarNextWeek = localDateISO(nextDutyWeekStart(new Date()));
    const targetWeek = localDateISO(nextDrawDutyWeekStart(new Date()));
    const hasCurrentResult = currentWinners.length && currentWinnersWeek;
    const labelWeek = hasCurrentResult ? currentWinnersWeek : targetWeek;
    const label = hasCurrentResult ? '值勤週 ' : labelWeek === calendarNextWeek ? '下週值日生 ' : '下一次值日生 ';
    $('hero-label').textContent = label + formatDutyWeek(labelWeek);
    $('next-draw-note').textContent = hasCurrentResult
      ? '下次按「開始抽籤」，會排入值勤週 ' + formatDutyWeek(targetWeek)
      : '按一次「開始抽籤」，就會排入這個值勤週。';
  }

  function renderCurrentResult(message) {
    renderResultLabel();
    if (currentWinners.length) showWinners(currentWinners);
    else clearResult(message || '尚未抽出值日生，按下方按鈕開始');
  }

  function renderAll() {
    renderMembers();
    renderProgress();
    renderHistory();
    renderCurrentResult();
  }

  drawBtn.addEventListener('click', draw);
  $('btn-reset').addEventListener('click', () => {
    if (drawing) return;
    if (!confirm('確定要重置本輪抽籤進度嗎？')) return;
    roundNum += 1;
    resetPool();
    currentWinners = [];
    currentWinnersWeek = null;
    renderCurrentResult('已重置，按下方按鈕重新抽籤');
    renderMembers();
    renderProgress();
    renderHistory();
    saveState();
    showToast('已開始第 ' + roundNum + ' 輪');
  });

  $('history-prev').addEventListener('click', () => moveHistoryWeek(1));
  $('history-next').addEventListener('click', () => moveHistoryWeek(-1));

  function moveHistoryWeek(direction) {
    const calendarNextWeek = nextDutyWeekStart(new Date());
    const targetWeek = nextDrawDutyWeekStart(new Date());
    const weekMap = new Map();
    history.forEach(item => {
      const start = parseDate(item.dutyWeekStart);
      weekMap.set(localDateISO(start), start);
    });
    weekMap.set(localDateISO(calendarNextWeek), calendarNextWeek);
    weekMap.set(localDateISO(targetWeek), targetWeek);
    const weeks = Array.from(weekMap.values()).sort((a, b) => b - a);
    const index = weeks.findIndex(start => localDateISO(start) === localDateISO(historyWeekStart || targetWeek));
    const nextIndex = Math.max(0, Math.min(weeks.length - 1, index + direction));
    if (nextIndex !== index) {
      historyWeekStart = weeks[nextIndex];
      renderHistory();
    }
  }

  function draw() {
    if (drawing) return;
    if (members.length < 2) {
      showToast('人員不足 2 人，請先新增成員');
      return;
    }

    const picked = [];
    let hasCarryover = false;
    if (pool.length === 0) {
      roundNum += 1;
      resetPool();
      showToast('所有人都抽過了，自動開始第 ' + roundNum + ' 輪');
    }

    if (pool.length === 1) {
      const deferred = pool.pop();
      const candidates = members.filter(name => name !== deferred);
      const dutyCounts = getDutyCounts(candidates);
      const minDutyCount = Math.min(...dutyCounts.values());
      const leastServed = candidates.filter(name => dutyCounts.get(name) === minDutyCount);
      const partner = leastServed[Math.floor(Math.random() * leastServed.length)];
      picked.push(deferred, partner);
      hasCarryover = true;
      showToast('本輪最後 1 人本週固定排入，再從值勤次數較少的成員中抽 1 位配對');
    } else {
      while (picked.length < 2) {
        const idx = Math.floor(Math.random() * pool.length);
        picked.push(pool.splice(idx, 1)[0]);
      }
    }
    picked.forEach(name => drawn.add(name));

    drawCount += 1;
    const date = localDateISO(new Date());
    const dutyWeekStart = localDateISO(nextDrawDutyWeekStart(parseDate(date)));
    history.unshift({
      id: createId(),
      round: roundNum,
      draw: drawCount,
      date: date,
      dutyWeekStart: dutyWeekStart,
      names: [...picked],
      carryover: hasCarryover,
      solo: false
    });
    currentWinners = [...picked];
    currentWinnersWeek = dutyWeekStart;
    renderResultLabel();
    historyWeekStart = parseDate(dutyWeekStart);
    saveState();

    const finish = () => {
      showWinners(picked);
      drawing = false;
      drawBtn.disabled = false;
      renderMembers();
      renderProgress();
      renderHistory();
    };

    if (reducedMotion) return finish();

    drawing = true;
    drawBtn.disabled = true;
    renderMembers();
    const all = members.length ? members : picked;
    let ticks = 0;
    const timer = setInterval(() => {
      const shufflePool = [...all];
      const shuffled = [];
      while (shuffled.length < 2 && shufflePool.length) {
        shuffled.push(shufflePool.splice(Math.floor(Math.random() * shufflePool.length), 1)[0]);
      }
      showWinners(shuffled, true);
      if (++ticks >= 9) {
        clearInterval(timer);
        finish();
      }
    }, 80);
  }

  $('add-form').addEventListener('submit', event => {
    event.preventDefault();
    addMember();
  });

  $('baseline-form').addEventListener('submit', event => {
    event.preventDefault();
    const inputs = $('baseline-list').querySelectorAll('input[data-member]');
    const updated = Object.assign(Object.create(null), baselineCounts);
    for (const input of inputs) {
      const count = input.valueAsNumber;
      if (!Number.isSafeInteger(count) || count < 0 || count > 999999) {
        showToast('次數請填寫 0 到 999999 的整數');
        input.focus();
        return;
      }
      updated[input.getAttribute('data-member')] = count;
    }
    baselineCounts = updated;
    renderMembers();
    saveState();
    showToast('已儲存網站上線前次數');
  });

  function addMember() {
    if (drawing) return;
    const name = newNameInput.value.trim();
    if (!name) {
      showToast('請輸入姓名');
      newNameInput.focus();
      return;
    }
    if (members.includes(name)) {
      showToast('「' + name + '」已在名單中');
      return;
    }
    members.push(name);
    pool.push(name);
    newNameInput.value = '';
    renderMembers();
    renderProgress();
    saveState();
    showToast('已新增「' + name + '」');
    newNameInput.focus();
  }

  function removeMember(name) {
    if (drawing) return;
    if (!confirm('確定要移除「' + name + '」嗎？')) return;
    members = members.filter(member => member !== name);
    pool = pool.filter(member => member !== name);
    drawn.delete(name);
    currentWinners = currentWinners.filter(winner => winner !== name);
    if (!currentWinners.length) currentWinnersWeek = null;
    renderCurrentResult('已移除當前值日生，請重新抽籤');
    renderMembers();
    renderProgress();
    renderHistory();
    saveState();
    showToast('已移除「' + name + '」');
  }

  function exportBackup() {
    const backup = {
      version: STORAGE_VERSION,
      exportedAt: new Date().toISOString(),
      members: members,
      pool: pool,
      drawn: Array.from(drawn),
      history: history,
      baselineCounts: baselineCounts,
      roundNum: roundNum,
      drawCount: drawCount,
      currentWinners: currentWinners,
      currentWinnersWeek: currentWinnersWeek
    };
    const blob = new Blob([JSON.stringify(backup, null, 2)], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const link = document.createElement('a');
    link.href = url;
    link.download = 'weekly-duty-draw-backup-' + localDateISO(new Date()) + '.json';
    document.body.appendChild(link);
    link.click();
    link.remove();
    setTimeout(() => URL.revokeObjectURL(url), 1000);
    showToast('備份檔已匯出');
  }

  function markdownCell(value) {
    return String(value == null ? '' : value).replace(/\\/g, '\\\\').replace(/\r?\n/g, ' ').replace(/\|/g, '\\|');
  }

  function exportMarkdown() {
    const dutyCounts = getDutyCounts(members);
    const memberRows = members.map(name => {
      const beforeSite = baselineCounts[name] || 0;
      const siteHistory = dutyCounts.get(name) - beforeSite;
      return '| ' + markdownCell(name) + ' | ' + beforeSite + ' | ' + siteHistory + ' | ' +
        dutyCounts.get(name) + ' | ' + (drawn.has(name) ? '本輪已排' : '本輪未排') + ' |';
    });
    const historyRows = history.length ? history.map(item => {
      const tags = ['第 ' + item.round + ' 輪・第 ' + item.draw + ' 次'];
      if (item.carryover) tags.push('含上輪遞延成員');
      if (item.solo) tags.push('本輪最後 1 人');
      return '| ' + formatDutyWeek(item.dutyWeekStart) + ' | ' + formatDate(item.date) + ' | ' +
        item.names.map(markdownCell).join('、') + ' | ' + tags.map(markdownCell).join('；') + ' |';
    }) : ['| 尚無紀錄 | — | — | — |'];
    const targetWeek = formatDutyWeek(localDateISO(nextDrawDutyWeekStart(new Date())));
    const lines = [
      '# 值日生抽籤紀錄',
      '',
      '- 匯出日期：' + formatDate(localDateISO(new Date())),
      '- 名單人數：' + members.length,
      '- 本輪：第 ' + roundNum + ' 輪（已排 ' + drawn.size + ' / ' + members.length + ' 人）',
      '- 下次抽籤排入：值勤週 ' + targetWeek,
      '',
      '## 人員累積值日次數',
      '',
      '| 成員 | 網站上線前 | 網站紀錄 | 累積合計 | 本輪狀態 |',
      '|---|---:|---:|---:|---|',
      ...memberRows,
      '',
      '## 歷史抽籤紀錄',
      '',
      '| 值勤週 | 抽籤日 | 值日生 | 輪次與標記 |',
      '|---|---|---|---|',
      ...historyRows,
      '',
      '---',
      '',
      '本檔是閱讀用 Markdown；如需匯回網站，請使用 JSON 備份。'
    ];
    const blob = new Blob([lines.join('\n') + '\n'], { type: 'text/markdown;charset=utf-8' });
    const url = URL.createObjectURL(blob);
    const link = document.createElement('a');
    link.href = url;
    link.download = 'weekly-duty-draw-' + localDateISO(new Date()) + '.md';
    document.body.appendChild(link);
    link.click();
    link.remove();
    setTimeout(() => URL.revokeObjectURL(url), 1000);
    showToast('Markdown 紀錄已匯出');
  }

  $('btn-export').addEventListener('click', exportBackup);
  $('btn-export-md').addEventListener('click', exportMarkdown);
  $('btn-import').addEventListener('click', () => $('import-file').click());
  $('import-file').addEventListener('change', event => {
    const file = event.target.files && event.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = () => {
      try {
        const imported = normalizeState(JSON.parse(String(reader.result)));
        if (!confirm('匯入會覆蓋這個瀏覽器目前的名單、進度與紀錄，確定繼續嗎？')) return;
        applyState(imported);
        historyWeekStart = imported.history.length
          ? parseDate(imported.history[0].dutyWeekStart) : nextDrawDutyWeekStart(new Date());
        saveState();
        renderAll();
        showToast('備份已匯入');
      } catch (error) {
        showToast('備份格式錯誤或版本不相容，沒有變更資料。');
      } finally {
        event.target.value = '';
      }
    };
    reader.onerror = () => {
      showToast('無法讀取備份檔');
      event.target.value = '';
    };
    reader.readAsText(file);
  });

  $('btn-clear').addEventListener('click', () => {
    if (!confirm('清除會刪除目前瀏覽器的名單、抽籤進度與歷史紀錄。確定嗎？')) return;
    if (!confirm('最後確認：這些資料清除後無法從網站還原。')) return;
    try {
      localStorage.removeItem(STORAGE_KEY);
    } catch (error) {
      showToast('無法清除瀏覽器儲存；請檢查瀏覽器設定。');
      return;
    }
    resetToDemo();
    historyWeekStart = nextDrawDutyWeekStart(new Date());
    renderAll();
    showToast('資料已清除，已恢復示範名單');
  });

  function showToast(message) {
    clearTimeout(toastTimer);
    toastEl.textContent = message;
    toastEl.classList.add('show');
    toastTimer = setTimeout(() => toastEl.classList.remove('show'), 3200);
  }

  loadState();
  historyWeekStart = history.length
    ? parseDate(history[0].dutyWeekStart) : nextDrawDutyWeekStart(new Date());
  renderAll();
  if (startupNotice) showToast(startupNotice);
})();
</script>
</body>
</html>
